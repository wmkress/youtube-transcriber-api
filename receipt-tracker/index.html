<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Receipts</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-action="tab" data-tab="overview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Overview</span>
    </button>
    <button class="tab" data-action="tab" data-tab="entries">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3" /></svg>
      <span>Expenses</span>
    </button>
    <button class="tab" data-action="tab" data-tab="properties">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7M5 9.5V20h5v-6h4v6h5V9.5" /></svg>
      <span>Properties</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="print" class="print-root"></div>

  <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="library-input" accept="image/*" hidden>
  <input type="file" id="restore-input" accept="application/json,.json" hidden>

  <script src="app.js" type="module"></script>
</body>
</html>
